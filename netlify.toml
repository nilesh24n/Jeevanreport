# NOTE: To deploy, always use: netlify deploy --trigger --prod
# Running --build locally on Windows causes @netlify/plugin-nextjs v5 onPostBuild
# to fail with "Failed publishing static content" due to Windows path handling.
# The --trigger flag runs the build on Netlify's Linux CI instead.
[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.16.0"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/product/:id"
  to = "/api/products/:id"
  status = 200

[dev]
  command = "npm run dev"
  port = 3000
