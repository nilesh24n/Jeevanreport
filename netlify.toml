[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.16.0"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/product/:id"
  to = "/api/products/:id"
  status = 200

[dev]
  command = "npm run dev"
  port = 3000
