<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 48" fill="none" role="img" aria-label="Jeevanreport logo">
  <defs>
    <clipPath id="logoLensClip">
      <circle cx="18" cy="17" r="11"/>
    </clipPath>
  </defs>

  <!-- Mascot Hanging from Scanner Handle (Left Emblem) -->
  <g transform="translate(1, 0) scale(0.85)">
    <!-- Yellow Handle -->
    <line x1="25" y1="24" x2="41" y2="38" stroke="#f59e0b" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="41" cy="38" r="2.8" fill="#d97706"/>

    <!-- Yellow Lens Ring -->
    <circle cx="18" cy="17" r="13" stroke="#f59e0b" stroke-width="3.8" fill="#ffffff"/>

    <!-- Barcode -->
    <g clip-path="url(#logoLensClip)">
      <rect x="5" y="4" width="26" height="26" fill="#ffffff"/>
      <rect x="9.5" y="7" width="2" height="19" fill="#18181b" rx="0.5"/>
      <rect x="13" y="7" width="1" height="19" fill="#18181b" rx="0.4"/>
      <rect x="15.5" y="7" width="2.8" height="19" fill="#18181b" rx="0.5"/>
      <rect x="20" y="7" width="1" height="19" fill="#18181b" rx="0.4"/>
      <rect x="22.5" y="7" width="2" height="19" fill="#18181b" rx="0.5"/>
      <!-- Scan beam -->
      <rect x="5" y="15" width="26" height="3" fill="#f59e0b" rx="1.5"/>
    </g>

    <!-- Arms -->
    <path d="M 29 34 L 29 28" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 35 36 L 35 32" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Body -->
    <path d="M 28 37 C 27 41, 28 44, 30 45 L 34 45 C 36 44, 37 41, 36 37 Z" fill="#2563eb"/>
    <rect x="29" y="44" width="2.2" height="3" rx="0.8" fill="#1d4ed8"/>
    <ellipse cx="30" cy="47" rx="1.6" ry="1" fill="#0f172a"/>
    <path d="M 33 44 L 35.5 46.5" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="36" cy="47" rx="1.6" ry="1" fill="#0f172a"/>

    <!-- Head -->
    <circle cx="32" cy="34" r="5.8" fill="#fed7aa"/>
    <path d="M 27 33 C 26.5 29.5, 29 28, 32 28 C 35 28, 37.5 29.5, 37 33 C 35.5 32, 34 32, 32 32.5 C 30.5 32, 29 32, 27 33 Z" fill="#0f172a"/>
    <circle cx="35.5" cy="30" r="1" fill="#fbbf24"/>

    <!-- Eyes & Smile -->
    <circle cx="30.5" cy="34" r="1" fill="#0f172a"/>
    <circle cx="33.5" cy="34" r="1" fill="#0f172a"/>
    <ellipse cx="29" cy="35.5" rx="1" ry="0.6" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="35" cy="35.5" rx="1" ry="0.6" fill="#f43f5e" opacity="0.6"/>
    <path d="M 31.2 36 Q 32 37 32.8 36" stroke="#9a3412" stroke-width="0.7" stroke-linecap="round" fill="none"/>

    <!-- VISIBLE WHITE GLOVES WITH DARK OUTLINE ON HANDLE -->
    <circle cx="29" cy="27" r="2.8" fill="#ffffff" stroke="#0f172a" stroke-width="1.1"/>
    <circle cx="35" cy="32" r="2.8" fill="#ffffff" stroke="#0f172a" stroke-width="1.1"/>
  </g>

  <!-- Wordmark -->
  <text x="46" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="19" fill="#1c1917" letter-spacing="-0.3">
    Jeevan<tspan fill="#d97706">Report</tspan>
  </text>
  <circle cx="184" cy="23" r="3" fill="#f59e0b"/>
  <text x="46" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#d97706" font-weight="700" letter-spacing="0.6">
    INDIA&#8217;S PRODUCT TRUTH PLATFORM
  </text>
</svg>
