<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 48" fill="none" role="img" aria-label="Jeevanreport logo">
  <defs>
    <linearGradient id="logoYellowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="logoCharSkin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="60%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="logoCharCloth" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <clipPath id="logoClipLens">
      <circle cx="22" cy="18" r="12.5"/>
    </clipPath>
  </defs>

  <!-- Hanging Mascot + Scanner on Left (scaled nicely) -->
  <g transform="translate(1, 0) scale(0.78)">
    <!-- Yellow Handle -->
    <line x1="32" y1="11" x2="43" y2="3" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="43" cy="3" r="2.2" fill="#d97706"/>

    <!-- Yellow Rim -->
    <circle cx="22" cy="18" r="14.5" stroke="url(#logoYellowGlow)" stroke-width="3" fill="#ffffff"/>

    <g clip-path="url(#logoClipLens)">
      <rect x="7" y="3" width="30" height="30" fill="#fefce8"/>
      <rect x="12" y="7" width="1.4" height="22" fill="#1c1917"/>
      <rect x="14.5" y="7" width="0.7" height="22" fill="#1c1917"/>
      <rect x="16.5" y="7" width="1.8" height="22" fill="#1c1917"/>
      <rect x="19.5" y="7" width="0.8" height="22" fill="#1c1917"/>
      <rect x="21.5" y="7" width="1.6" height="22" fill="#1c1917"/>
      <rect x="24.2" y="7" width="0.8" height="22" fill="#1c1917"/>
      <rect x="26.2" y="7" width="1.8" height="22" fill="#1c1917"/>
      <rect x="29" y="7" width="0.9" height="22" fill="#1c1917"/>
      <!-- Scan beam -->
      <rect x="8" y="16.5" width="28" height="2.2" fill="#f59e0b" opacity="0.9" rx="1.1"/>
    </g>

    <!-- Mascot Hanging From Rim -->
    <!-- Arms -->
    <path d="M 17 35 Q 15 31 16 29" stroke="url(#logoCharCloth)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 27 35 Q 29 31 28 29" stroke="url(#logoCharCloth)" stroke-width="3" stroke-linecap="round"/>
    <!-- Hands gripping -->
    <circle cx="16" cy="29" r="1.8" fill="url(#logoCharSkin)"/>
    <circle cx="28" cy="29" r="1.8" fill="url(#logoCharSkin)"/>

    <!-- Head -->
    <circle cx="22" cy="37" r="7.2" fill="url(#logoCharSkin)"/>
    <!-- Hair -->
    <path d="M 15 36 C 14.5 31, 18 29, 22 29 C 26 29, 29.5 31, 29 36 C 27 34, 25 34, 23 35 C 21 33, 18 33, 16 35 Z" fill="#1e293b"/>
    <circle cx="26" cy="32" r="1.2" fill="#fbbf24"/>
    <!-- Eyes -->
    <ellipse cx="20" cy="37" rx="1.4" ry="1.8" fill="#0f172a"/>
    <circle cx="19.5" cy="36.4" r="0.6" fill="#ffffff"/>
    <ellipse cx="24" cy="37" rx="1.4" ry="1.8" fill="#0f172a"/>
    <circle cx="23.5" cy="36.4" r="0.6" fill="#ffffff"/>
    <!-- Blush & Smile -->
    <ellipse cx="17.8" cy="39" rx="1.2" ry="0.8" fill="#f43f5e" opacity="0.45"/>
    <ellipse cx="26.2" cy="39" rx="1.2" ry="0.8" fill="#f43f5e" opacity="0.45"/>
    <path d="M 20.8 39.2 Q 22 40.5 23.2 39.2" stroke="#7c2d12" stroke-width="0.8" stroke-linecap="round" fill="none"/>

    <!-- Dangling Body & Kicking Legs -->
    <path d="M 17 41 C 16 45, 17 49, 19.5 50 L 24.5 50 C 27 49, 28 45, 27 41 Z" fill="url(#logoCharCloth)"/>
    <rect x="18.5" y="49" width="2.4" height="3" rx="1" fill="#1d4ed8"/>
    <ellipse cx="19.5" cy="52.5" rx="1.8" ry="1.2" fill="#0f172a"/>
    <path d="M 23 49 L 25.5 52" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="26.5" cy="52" rx="1.8" ry="1.2" fill="#0f172a"/>
  </g>

  <!-- Wordmark -->
  <text x="48" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="19" fill="#1c1917" letter-spacing="-0.3">
    Jeevan<tspan fill="#d97706">Report</tspan>
  </text>
  <circle cx="186" cy="23" r="3" fill="#f59e0b"/>
  <text x="48" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#d97706" font-weight="700" letter-spacing="0.6">
    INDIA&#8217;S PRODUCT TRUTH PLATFORM
  </text>
</svg>
