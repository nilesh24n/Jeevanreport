<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 48" fill="none" role="img" aria-label="Jeevanreport logo">
  <defs>
    <clipPath id="logoLensClip">
      <circle cx="18" cy="17" r="11"/>
    </clipPath>
  </defs>

  <!-- Mascot Hanging from Scanner Handle (Left Emblem) -->
  <g transform="translate(1, 0) scale(0.85)">
    <!-- Yellow Handle -->
    <line x1="25" y1="24" x2="39" y2="36" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="39" cy="36" r="2.4" fill="#d97706"/>

    <!-- Yellow Lens Ring -->
    <circle cx="18" cy="17" r="13" stroke="#f59e0b" stroke-width="3.5" fill="#ffffff"/>

    <!-- Barcode -->
    <g clip-path="url(#logoLensClip)">
      <rect x="5" y="4" width="26" height="26" fill="#ffffff"/>
      <rect x="9.5" y="7" width="2" height="19" fill="#18181b" rx="0.5"/>
      <rect x="13" y="7" width="1" height="19" fill="#18181b" rx="0.4"/>
      <rect x="15.5" y="7" width="2.8" height="19" fill="#18181b" rx="0.5"/>
      <rect x="20" y="7" width="1" height="19" fill="#18181b" rx="0.4"/>
      <rect x="22.5" y="7" width="2" height="19" fill="#18181b" rx="0.5"/>
      <!-- Scan beam -->
      <rect x="5" y="15" width="26" height="3" fill="#f59e0b" rx="1.5"/>
    </g>

    <!-- Mascot Hanging From Handle -->
    <!-- Arms reaching to handle -->
    <path d="M 29 33 L 29 27" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 34 35 L 34 31" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Body -->
    <path d="M 28 36 C 27 40, 28 43, 30 44 L 33 44 C 35 43, 36 40, 35 36 Z" fill="#2563eb"/>
    <rect x="29" y="43" width="2.2" height="3" rx="0.8" fill="#1d4ed8"/>
    <ellipse cx="30" cy="46" rx="1.6" ry="1" fill="#0f172a"/>
    <path d="M 33 43 L 35 45.5" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="35.5" cy="46" rx="1.6" ry="1" fill="#0f172a"/>

    <!-- Head -->
    <circle cx="31" cy="33" r="5.5" fill="#fed7aa"/>
    <path d="M 26.5 32 C 26 28.5, 28.5 27, 31 27 C 33.5 27, 36 28.5, 35.5 32 C 34 31, 33 31, 31 31.5 C 29.5 31, 28 31, 26.5 32 Z" fill="#0f172a"/>
    <circle cx="34.5" cy="29" r="1" fill="#fbbf24"/>

    <!-- Eyes & Smile -->
    <circle cx="29.5" cy="33" r="1" fill="#0f172a"/>
    <circle cx="32.5" cy="33" r="1" fill="#0f172a"/>
    <ellipse cx="28" cy="34.5" rx="1" ry="0.6" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="34" cy="34.5" rx="1" ry="0.6" fill="#f43f5e" opacity="0.6"/>
    <path d="M 30.2 35 Q 31 36 31.8 35" stroke="#9a3412" stroke-width="0.7" stroke-linecap="round" fill="none"/>

    <!-- Hands on handle -->
    <circle cx="29" cy="27" r="1.8" fill="#fdba74"/>
    <circle cx="34" cy="31" r="1.8" fill="#fdba74"/>
  </g>

  <!-- Wordmark -->
  <text x="46" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="19" fill="#1c1917" letter-spacing="-0.3">
    Jeevan<tspan fill="#d97706">Report</tspan>
  </text>
  <circle cx="184" cy="23" r="3" fill="#f59e0b"/>
  <text x="46" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#d97706" font-weight="700" letter-spacing="0.6">
    INDIA&#8217;S PRODUCT TRUTH PLATFORM
  </text>
</svg>
