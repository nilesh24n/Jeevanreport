<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none" role="img" aria-label="Jeevanreport logo">
  <!-- Icon: Barcode + Magnifying glass -->
  <g>
    <!-- Outer lens circle -->
    <circle cx="24" cy="22" r="16" stroke="#9b7653" stroke-width="2.5" fill="none"/>
    <!-- Barcode lines inside lens (clipped to circle) -->
    <clipPath id="lens-clip">
      <circle cx="24" cy="22" r="13.5"/>
    </clipPath>
    <g clip-path="url(#lens-clip)">
      <!-- Barcode stripes: varying widths for authentic look -->
      <rect x="11" y="10" width="1.5" height="24" fill="#2c1a0e"/>
      <rect x="13.5" y="10" width="0.8" height="24" fill="#2c1a0e"/>
      <rect x="15.2" y="10" width="2" height="24" fill="#2c1a0e"/>
      <rect x="18.2" y="10" width="0.8" height="24" fill="#2c1a0e"/>
      <rect x="20" y="10" width="1.5" height="24" fill="#2c1a0e"/>
      <rect x="22.5" y="10" width="0.8" height="24" fill="#2c1a0e"/>
      <rect x="24.3" y="10" width="2" height="24" fill="#2c1a0e"/>
      <rect x="27.3" y="10" width="0.8" height="24" fill="#2c1a0e"/>
      <rect x="29.1" y="10" width="1.5" height="24" fill="#2c1a0e"/>
      <rect x="31.6" y="10" width="0.8" height="24" fill="#2c1a0e"/>
      <rect x="33.4" y="10" width="1.5" height="24" fill="#2c1a0e"/>
      <!-- Scan line overlay -->
      <rect x="11" y="19" width="26" height="2.5" fill="#9b7653" opacity="0.45" rx="1"/>
    </g>
    <!-- Handle -->
    <line x1="36" y1="35" x2="43" y2="43" stroke="#9b7653" stroke-width="3" stroke-linecap="round"/>
    <!-- Handle cap -->
    <circle cx="43" cy="43" r="1.5" fill="#9b7653"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="28" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="18" fill="#2c1a0e" letter-spacing="-0.3">Jeevanreport</text>
  <!-- Tagline dot -->
  <text x="52" y="38" font-family="system-ui, sans-serif" font-size="8" fill="#9b7653" font-weight="600" letter-spacing="0.5">INDIA&#8217;S PRODUCT TRUTH PLATFORM</text>
</svg>
