<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 48" fill="none" role="img" aria-label="Jeevanreport logo">
  <defs>
    <clipPath id="logoLensClip">
      <circle cx="16" cy="16" r="10.5"/>
    </clipPath>
  </defs>

  <g transform="translate(1, 1) scale(0.9)">
    <line x1="23" y1="22" x2="40" y2="36" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="40" cy="36" r="2.6" fill="#d97706"/>

    <circle cx="16" cy="16" r="12.5" stroke="#f59e0b" stroke-width="3.6" fill="#ffffff"/>

    <g clip-path="url(#logoLensClip)">
      <rect x="4" y="4" width="24" height="24" fill="#ffffff"/>
      <rect x="8"  y="7" width="1.8" height="18" fill="#18181b" rx="0.5"/>
      <rect x="11.5" y="7" width="1" height="18" fill="#18181b" rx="0.4"/>
      <rect x="14" y="7" width="2.6" height="18" fill="#18181b" rx="0.5"/>
      <rect x="18" y="7" width="1" height="18" fill="#18181b" rx="0.4"/>
      <rect x="20.5" y="7" width="1.8" height="18" fill="#18181b" rx="0.5"/>
      <rect x="4" y="14.5" width="24" height="2.8" fill="#f59e0b" rx="1.4"/>
    </g>

    <!-- Mascot hanging by left hand & waving right hand -->
    <!-- Left arm hanging -->
    <path d="M 28 32 L 28 26" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Left hand on handle -->
    <path d="M 26 27 L 26 24 C 26 22, 30 22, 30 24 L 30 27 Z" fill="#fed7aa" stroke="#d97706" stroke-width="0.7"/>

    <!-- Body -->
    <path d="M 27 37 C 26 41, 27 44, 29 45 L 33 45 C 35 44, 36 41, 35 37 Z" fill="#2563eb"/>
    <rect x="27.5" y="44" width="2" height="3" rx="0.8" fill="#1d4ed8"/>
    <ellipse cx="28.5" cy="47" rx="1.5" ry="1.1" fill="#0f172a"/>
    <path d="M 31.5 44 L 34 46.5" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="34.5" cy="47" rx="1.5" ry="1.1" fill="#0f172a"/>

    <!-- Head -->
    <circle cx="31" cy="33" r="5.5" fill="#fed7aa"/>
    <path d="M 26.5 32 C 26 28.5, 28.5 27, 31 27 C 33.5 27, 36 28.5, 35.5 32 Z" fill="#0f172a"/>
    <circle cx="34" cy="29" r="1" fill="#fbbf24"/>

    <!-- Eyes & Smile -->
    <circle cx="29.5" cy="33" r="1" fill="#0f172a"/>
    <circle cx="32.5" cy="33" r="1" fill="#0f172a"/>
    <ellipse cx="28" cy="34.5" rx="0.9" ry="0.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="34" cy="34.5" rx="0.9" ry="0.5" fill="#f43f5e" opacity="0.6"/>
    <path d="M 30.2 35 Q 31 36 31.8 35" stroke="#9a3412" stroke-width="0.7" stroke-linecap="round" fill="none"/>

    <!-- Right Arm Waving -->
    <path d="M 34 35 Q 38 33 40 29" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <circle cx="41.5" cy="27.5" r="2.2" fill="#fed7aa" stroke="#d97706" stroke-width="0.6"/>
    <line x1="41" y1="25.5" x2="41" y2="23.5" stroke="#d97706" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="42.2" y1="25.2" x2="42.6" y2="23.2" stroke="#d97706" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="43.2" y1="25.8" x2="43.9" y2="24.2" stroke="#d97706" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <text x="46" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="19" fill="#1c1917" letter-spacing="-0.3">
    Jeevan<tspan fill="#d97706">Report</tspan>
  </text>
  <circle cx="184" cy="23" r="3" fill="#f59e0b"/>
  <text x="46" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#d97706" font-weight="700" letter-spacing="0.6">
    INDIA&#8217;S PRODUCT TRUTH PLATFORM
  </text>
</svg>
