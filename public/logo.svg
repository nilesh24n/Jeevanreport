<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 48" fill="none" role="img" aria-label="Jeevanreport logo">
  <defs>
    <linearGradient id="logoYellowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="logoCharSkin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="60%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="logoCharCloth" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <clipPath id="logoClipLens">
      <circle cx="33" cy="20" r="11"/>
    </clipPath>
  </defs>

  <!-- Cute Toy Person (scaled & positioned left) -->
  <g transform="translate(2, 2) scale(0.72)">
    <!-- Body -->
    <path d="M 10 58 C 10 47, 16 42, 24 42 C 32 42, 38 47, 38 58 Z" fill="url(#logoCharCloth)"/>
    <path d="M 21 42 L 24 48 L 27 42" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="17" cy="59" rx="4.5" ry="2.5" fill="#0f172a"/>
    <ellipse cx="31" cy="59" rx="4.5" ry="2.5" fill="#0f172a"/>

    <!-- Head -->
    <circle cx="24" cy="24" r="13" fill="url(#logoCharSkin)"/>
    <!-- Hair -->
    <path d="M 12 23 C 11 15, 16 12, 24 12 C 32 12, 37 15, 36 23 C 34 20, 32 19, 29 20 C 27 18, 23 18, 20 20 C 16 19, 13 20, 12 23 Z" fill="#1e293b"/>
    <circle cx="31" cy="17" r="2" fill="#fbbf24"/>

    <!-- Eyes -->
    <ellipse cx="19" cy="25" rx="2" ry="2.6" fill="#0f172a"/>
    <circle cx="18.3" cy="24" r="0.9" fill="#ffffff"/>
    <ellipse cx="27" cy="25" rx="2" ry="2.6" fill="#0f172a"/>
    <circle cx="26.3" cy="24" r="0.9" fill="#ffffff"/>

    <!-- Blush & Smile -->
    <ellipse cx="15.5" cy="28.5" rx="2" ry="1.2" fill="#f43f5e" opacity="0.45"/>
    <ellipse cx="30.5" cy="28.5" rx="2" ry="1.2" fill="#f43f5e" opacity="0.45"/>
    <path d="M 21.5 29 Q 23.5 31.5 25.5 29" stroke="#7c2d12" stroke-width="1.1" stroke-linecap="round" fill="none"/>

    <!-- Yellow Magnifying Glass / Barcode held by character -->
    <line x1="30" y1="33" x2="20" y2="45" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="20" cy="45" r="2.8" fill="#d97706"/>
    <circle cx="38" cy="25" r="15" stroke="url(#logoYellowGlow)" stroke-width="3.5" fill="#ffffff"/>
    
    <g clip-path="url(#logoClipLens)">
      <rect x="23" y="10" width="30" height="30" fill="#fefce8"/>
      <rect x="26" y="14" width="1.5" height="22" fill="#1c1917"/>
      <rect x="29" y="14" width="0.8" height="22" fill="#1c1917"/>
      <rect x="31" y="14" width="2" height="22" fill="#1c1917"/>
      <rect x="34" y="14" width="0.8" height="22" fill="#1c1917"/>
      <rect x="36" y="14" width="1.8" height="22" fill="#1c1917"/>
      <rect x="39" y="14" width="1" height="22" fill="#1c1917"/>
      <rect x="41" y="14" width="1.6" height="22" fill="#1c1917"/>
      <!-- Scan beam -->
      <rect x="24" y="23.5" width="28" height="2.5" fill="#f59e0b" opacity="0.85" rx="1.2"/>
    </g>

    <!-- Hands -->
    <circle cx="25" cy="39" r="3" fill="url(#logoCharSkin)"/>
    <circle cx="31" cy="34" r="2.8" fill="url(#logoCharSkin)"/>
  </g>

  <!-- Wordmark -->
  <text x="50" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="19" fill="#1c1917" letter-spacing="-0.3">
    Jeevan<tspan fill="#d97706">Report</tspan>
  </text>
  <circle cx="188" cy="23" r="3" fill="#f59e0b"/>
  <!-- Tagline -->
  <text x="50" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#d97706" font-weight="700" letter-spacing="0.6">
    INDIA&#8217;S PRODUCT TRUTH PLATFORM
  </text>
</svg>
