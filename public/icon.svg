<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" fill="none" role="img" aria-label="JeevanReport Logo - Mascot Hanging from Scanner Handle">
  <defs>
    <!-- Barcode clip for round lens -->
    <clipPath id="lensClip">
      <circle cx="20" cy="18" r="12"/>
    </clipPath>
  </defs>

  <!-- === YELLOW SCANNER (Bold, Crisp, High Contrast) === -->
  <g id="scanner">
    <!-- Sturdy Yellow Handle (diagonal down-right) -->
    <line x1="28" y1="26" x2="44" y2="40" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <line x1="28" y1="26" x2="44" y2="40" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 18 6 0"/>
    <circle cx="44" cy="40" r="2.8" fill="#d97706"/>
    <circle cx="44" cy="40" r="1.6" fill="#fde047"/>

    <!-- Lens Outer Ring (Vibrant Golden Yellow) -->
    <circle cx="20" cy="18" r="14.5" stroke="#f59e0b" stroke-width="4" fill="#ffffff"/>

    <!-- Lens Glass & Clean Barcode Stripes -->
    <g clip-path="url(#lensClip)">
      <rect x="6" y="4" width="28" height="28" fill="#ffffff"/>
      
      <!-- 5 Bold, distinct barcode stripes with great spacing (super clear at any size) -->
      <rect x="11"   y="8" width="2.2" height="20" fill="#18181b" rx="0.6"/>
      <rect x="15"   y="8" width="1.2" height="20" fill="#18181b" rx="0.4"/>
      <rect x="18"   y="8" width="3.2" height="20" fill="#18181b" rx="0.6"/>
      <rect x="23"   y="8" width="1.2" height="20" fill="#18181b" rx="0.4"/>
      <rect x="26"   y="8" width="2.2" height="20" fill="#18181b" rx="0.6"/>

      <!-- Bold Yellow Laser Beam -->
      <rect x="6" y="16" width="28" height="3.2" fill="#f59e0b" rx="1.6"/>
      <rect x="6" y="17" width="28" height="1.2" fill="#fef08a" rx="0.6"/>
    </g>

    <!-- Glossy reflection arc on glass -->
    <path d="M 12 12 A 10 10 0 0 1 24 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- === CUTE TOY MASCOT HANGING FROM THE HANDLE === -->
  <g id="mascot-hanging-from-handle">
    <!-- Arms reaching up to grab the handle -->
    <!-- Left arm to upper handle -->
    <path d="M 33 36 L 33 29" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <!-- Right arm to lower handle -->
    <path d="M 39 39 L 39 34" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>

    <!-- Dangling Body / Hoodie (Vibrant Electric Blue) -->
    <path d="M 31 40 C 30 44, 31 47, 33 48 L 38 48 C 40 47, 41 44, 40 40 Z" fill="#2563eb"/>
    <!-- Yellow zipper badge -->
    <line x1="35.5" y1="40" x2="35.5" y2="44" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Cute swinging legs & shoes -->
    <!-- Left leg dangling straight -->
    <rect x="32" y="47" width="2.6" height="3.5" rx="1" fill="#1d4ed8"/>
    <ellipse cx="33" cy="51" rx="2" ry="1.4" fill="#0f172a"/>

    <!-- Right leg playfully kicking back -->
    <path d="M 37 47 L 40 50" stroke="#1d4ed8" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="41" cy="50.5" rx="2" ry="1.4" fill="#0f172a" transform="rotate(-20 41 50.5)"/>

    <!-- Round Chibi Head -->
    <circle cx="35" cy="36" r="6.5" fill="#fed7aa"/>

    <!-- Sleek Dark Hair / Beanie with Yellow Star Pin -->
    <path d="M 29.5 35 C 29 30.5, 32 29, 35 29 C 38 29, 41 30.5, 40.5 35 C 39 33.5, 37 33.5, 35 34 C 33 33, 31 33.5, 29.5 35 Z" fill="#0f172a"/>
    <circle cx="39" cy="31" r="1.2" fill="#fbbf24"/>

    <!-- Big Expressive Eyes (Bold & Clear) -->
    <circle cx="33" cy="36" r="1.3" fill="#0f172a"/>
    <circle cx="32.6" cy="35.5" r="0.5" fill="#ffffff"/>

    <circle cx="37" cy="36" r="1.3" fill="#0f172a"/>
    <circle cx="36.6" cy="35.5" r="0.5" fill="#ffffff"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="31.2" cy="38" rx="1.2" ry="0.7" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="38.8" cy="38" rx="1.2" ry="0.7" fill="#f43f5e" opacity="0.6"/>

    <!-- Cheerful Smile -->
    <path d="M 34 38.5 Q 35 40 36 38.5" stroke="#9a3412" stroke-width="0.8" stroke-linecap="round" fill="none"/>

    <!-- Hands CLAMPED ONTO THE YELLOW HANDLE (Round cute paws wrapping over the handle) -->
    <!-- Left hand on handle -->
    <circle cx="33" cy="29" r="2.2" fill="#fdba74"/>
    <path d="M 31.8 28.8 Q 33 27.8 34.2 28.8" stroke="#ea580c" stroke-width="0.7" fill="none"/>

    <!-- Right hand on handle -->
    <circle cx="39" cy="34" r="2.2" fill="#fdba74"/>
    <path d="M 37.8 33.8 Q 39 32.8 40.2 33.8" stroke="#ea580c" stroke-width="0.7" fill="none"/>
  </g>
</svg>
