<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 58" fill="none" role="img" aria-label="JeevanReport Logo - Mascot Hanging from Middle of Scanner Handle and Waving">
  <defs>
    <clipPath id="lensClip">
      <circle cx="17" cy="15" r="11.5"/>
    </clipPath>
  </defs>

  <g id="slanted-scanner">
    <line x1="24" y1="22" x2="42" y2="37" stroke="#f59e0b" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="42" cy="37" r="3" fill="#d97706"/>
    <circle cx="42" cy="37" r="1.6" fill="#fde047"/>
    <circle cx="17" cy="15" r="14" stroke="#f59e0b" stroke-width="4.2" fill="#ffffff"/>
    <g clip-path="url(#lensClip)">
      <rect x="3" y="1" width="28" height="28" fill="#ffffff"/>
      <rect x="8"   y="5" width="2.2" height="20" fill="#18181b" rx="0.6"/>
      <rect x="11.8" y="5" width="1.2" height="20" fill="#18181b" rx="0.4"/>
      <rect x="14.8" y="5" width="3.2" height="20" fill="#18181b" rx="0.6"/>
      <rect x="19.8" y="5" width="1.2" height="20" fill="#18181b" rx="0.4"/>
      <rect x="22.8" y="5" width="2.2" height="20" fill="#18181b" rx="0.6"/>
      <rect x="3" y="13.2" width="28" height="3.2" fill="#f59e0b" rx="1.6"/>
      <rect x="3" y="14.2" width="28" height="1.2" fill="#fef08a" rx="0.6"/>
    </g>
    <path d="M 9 9 A 10 10 0 0 1 21 7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>

  <g id="mascot-hanging-middle">
    <!-- Left Arm from shoulder (31, 38) up to hand at middle of handle (33, 29.5) -->
    <path d="M 32 38 L 33 31" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Left Hand wrapping around MIDDLE of slanted handle (midpoint is 33, 29.5) -->
    <path d="M 30.5 32.5 L 30.5 28 C 30.5 26, 35.5 26, 35.5 28 L 35.5 32.5 Z" fill="#fed7aa" stroke="#d97706" stroke-width="0.8"/>
    <line x1="32.2" y1="27.5" x2="32.2" y2="31" stroke="#d97706" stroke-width="0.6" stroke-linecap="round"/>
    <line x1="33.8" y1="27.5" x2="33.8" y2="31" stroke="#d97706" stroke-width="0.6" stroke-linecap="round"/>

    <!-- Dangling Body / Blue Hoodie below shoulders -->
    <path d="M 31 39 C 30 43, 31 46, 33 47 L 37.5 47 C 39.5 46, 40.5 43, 39.5 39 Z" fill="#2563eb"/>
    <line x1="35.5" y1="39" x2="35.5" y2="44" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Dangling Legs & Shoes -->
    <rect x="32" y="46" width="2.4" height="4" rx="1" fill="#1d4ed8"/>
    <ellipse cx="33" cy="50.5" rx="2" ry="1.4" fill="#0f172a"/>
    <path d="M 36.5 46 L 39.5 49.5" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="40.5" cy="50" rx="2" ry="1.4" fill="#0f172a" transform="rotate(-20 40.5 50)"/>

    <!-- Round Chibi Head -->
    <circle cx="36" cy="34" r="6.2" fill="#fed7aa"/>

    <!-- Hair / Cap with gold star pin -->
    <path d="M 30.5 33 C 30 28.5, 33 27, 36 27 C 39 27, 42 28.5, 41.5 33 C 40 31.8, 38 31.8, 36 32.5 C 34 31.8, 32 31.8, 30.5 33 Z" fill="#0f172a"/>
    <circle cx="39.5" cy="29" r="1.1" fill="#fbbf24"/>

    <!-- Big Expressive Eyes -->
    <circle cx="34" cy="34" r="1.2" fill="#0f172a"/>
    <circle cx="33.7" cy="33.6" r="0.45" fill="#ffffff"/>
    <circle cx="38" cy="34" r="1.2" fill="#0f172a"/>
    <circle cx="37.7" cy="33.6" r="0.45" fill="#ffffff"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="32.5" cy="36" rx="1" ry="0.6" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="39.5" cy="36" rx="1" ry="0.6" fill="#f43f5e" opacity="0.6"/>

    <!-- Cheerful Smile -->
    <path d="M 35 36.2 Q 36 37.4 37 36.2" stroke="#9a3412" stroke-width="0.8" stroke-linecap="round" fill="none"/>

    <!-- Right Arm from shoulder (39, 39) curving up-right to WAVE -->
    <path d="M 39 39 Q 42 36 45 32" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Waving Right Hand (open palm with distinct fingers) -->
    <circle cx="46" cy="29.5" r="2.6" fill="#fed7aa" stroke="#d97706" stroke-width="0.7"/>
    <line x1="45.2" y1="27.5" x2="45.2" y2="25.2" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="46.5" y1="27" x2="46.9" y2="24.8" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="47.8" y1="27.6" x2="48.6" y2="25.8" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Golden wave motion sparkles -->
    <path d="M 50 23.8 Q 51.2 25.8 50 27.8" stroke="#fbbf24" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <path d="M 52 24.8 Q 53 26.3 52 27.8" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
