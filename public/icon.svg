<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" role="img" aria-label="JeevanReport Logo - Mascot Hanging from Slanted Scanner Handle and Waving">
  <defs>
    <clipPath id="lensClip">
      <circle cx="19" cy="17" r="11.5"/>
    </clipPath>
  </defs>

  <g id="slanted-scanner">
    <line x1="26" y1="24" x2="44" y2="39" stroke="#f59e0b" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="44" cy="39" r="3" fill="#d97706"/>
    <circle cx="44" cy="39" r="1.6" fill="#fde047"/>

    <circle cx="19" cy="17" r="14" stroke="#f59e0b" stroke-width="4.2" fill="#ffffff"/>

    <g clip-path="url(#lensClip)">
      <rect x="5" y="3" width="28" height="28" fill="#ffffff"/>
      
      <rect x="10"   y="7" width="2.2" height="20" fill="#18181b" rx="0.6"/>
      <rect x="13.8" y="7" width="1.2" height="20" fill="#18181b" rx="0.4"/>
      <rect x="16.8" y="7" width="3.2" height="20" fill="#18181b" rx="0.6"/>
      <rect x="21.8" y="7" width="1.2" height="20" fill="#18181b" rx="0.4"/>
      <rect x="24.8" y="7" width="2.2" height="20" fill="#18181b" rx="0.6"/>

      <rect x="5" y="15.2" width="28" height="3.2" fill="#f59e0b" rx="1.6"/>
      <rect x="5" y="16.2" width="28" height="1.2" fill="#fef08a" rx="0.6"/>
    </g>

    <path d="M 11 11 A 10 10 0 0 1 23 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g id="mascot-hanging-and-waving">
    <!-- Left Arm reaching UP to hang from slanted handle -->
    <path d="M 31 35 L 31 28" stroke="#2563eb" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Left Hand wrapping OVER the slanted yellow handle (clear peach hand, no black dots) -->
    <path d="M 28.5 29.5 L 28.5 25.5 C 28.5 23.5, 33.5 23.5, 33.5 25.5 L 33.5 29.5 Z" fill="#fed7aa" stroke="#d97706" stroke-width="0.8"/>
    <line x1="30.2" y1="25" x2="30.2" y2="28" stroke="#d97706" stroke-width="0.6" stroke-linecap="round"/>
    <line x1="31.8" y1="25" x2="31.8" y2="28" stroke="#d97706" stroke-width="0.6" stroke-linecap="round"/>

    <!-- Dangling Body / Hoodie -->
    <path d="M 30 40 C 29 44, 30 47, 32 48 L 37 48 C 39 47, 40 44, 39 40 Z" fill="#2563eb"/>
    <line x1="34.5" y1="40" x2="34.5" y2="44" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Kicking legs & shoes -->
    <rect x="31" y="47" width="2.4" height="3.5" rx="1" fill="#1d4ed8"/>
    <ellipse cx="32" cy="51" rx="1.8" ry="1.3" fill="#0f172a"/>

    <path d="M 36 47 L 39 50" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="40" cy="50.5" rx="1.8" ry="1.3" fill="#0f172a" transform="rotate(-20 40 50.5)"/>

    <!-- Round Chibi Head -->
    <circle cx="34" cy="36" r="6.2" fill="#fed7aa"/>

    <!-- Dark Hair / Beanie with Yellow Star Pin -->
    <path d="M 28.5 35 C 28 31, 31 29.5, 34 29.5 C 37 29.5, 40 31, 39.5 35 C 38 33.8, 36 33.8, 34 34.5 C 32 33.8, 30 33.8, 28.5 35 Z" fill="#0f172a"/>
    <circle cx="37.5" cy="31.5" r="1.1" fill="#fbbf24"/>

    <!-- Big Expressive Eyes -->
    <circle cx="32" cy="36" r="1.2" fill="#0f172a"/>
    <circle cx="31.7" cy="35.6" r="0.45" fill="#ffffff"/>

    <circle cx="36" cy="36" r="1.2" fill="#0f172a"/>
    <circle cx="35.7" cy="35.6" r="0.45" fill="#ffffff"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="30.5" cy="38" rx="1" ry="0.6" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="37.5" cy="38" rx="1" ry="0.6" fill="#f43f5e" opacity="0.6"/>

    <!-- Cheerful Smile -->
    <path d="M 33 38.2 Q 34 39.4 35 38.2" stroke="#9a3412" stroke-width="0.8" stroke-linecap="round" fill="none"/>

    <!-- Right Arm reaching up and out to WAVE -->
    <path d="M 37 38 Q 41 36 44 32" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round"/>

    <!-- Right Hand WAVING (Open palm with fingers) -->
    <circle cx="45" cy="30" r="2.6" fill="#fed7aa" stroke="#d97706" stroke-width="0.7"/>
    <!-- Thumb -->
    <path d="M 43.5 31.5 Q 42.5 30 43.8 29.5" stroke="#d97706" stroke-width="0.7" fill="#fed7aa"/>
    <!-- Waving fingers -->
    <line x1="44.2" y1="28" x2="44.2" y2="26" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="45.5" y1="27.6" x2="45.9" y2="25.5" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="46.8" y1="28.2" x2="47.6" y2="26.4" stroke="#d97706" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Little golden wave motion sparks -->
    <path d="M 49 24.5 Q 50.2 26.5 49 28.5" stroke="#fbbf24" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <path d="M 51 25.5 Q 52 27 51 28.5" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
