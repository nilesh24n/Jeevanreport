<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="JeevanReport Logo - Cute Toy Person Holding Yellow Scanner">
  <defs>
    <!-- Vibrant Yellow Gradients -->
    <linearGradient id="yellowGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="handleYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="charSkin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="60%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="charCloth" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="hairGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>

    <!-- Barcode clip circle inside magnifying glass -->
    <clipPath id="lensBarcodeClip">
      <circle cx="41" cy="27" r="14.5"/>
    </clipPath>
  </defs>

  <!-- === CUTE TOY CHARACTER === -->
  <g id="toy-character">
    <!-- Body / Torso (Cute mini hoodie) -->
    <path d="M 12 58 C 12 47, 18 42, 26 42 C 34 42, 40 47, 40 58 Z" fill="url(#charCloth)"/>
    <!-- Yellow hoodie collar / zipper detail -->
    <path d="M 23 42 L 26 48 L 29 42" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cute toy feet (peeking at bottom) -->
    <ellipse cx="19" cy="59" rx="5" ry="3" fill="#0f172a"/>
    <ellipse cx="33" cy="59" rx="5" ry="3" fill="#0f172a"/>

    <!-- Left Arm -->
    <path d="M 14 45 C 12 50, 15 54, 20 51" stroke="url(#charCloth)" stroke-width="5" stroke-linecap="round"/>

    <!-- Cute Round Head -->
    <circle cx="26" cy="25" r="14.5" fill="url(#charSkin)"/>

    <!-- Cute Hair / Beanie Cap (stylish toy hair) -->
    <path d="M 12 24 C 11 15, 17 11, 26 11 C 35 11, 41 15, 40 24 C 38 21, 35 20, 32 21 C 29 19, 25 19, 21 21 C 17 19, 14 21, 12 24 Z" fill="url(#hairGrad)"/>
    <!-- Little yellow hair pin / star accessory -->
    <circle cx="34" cy="17" r="2.2" fill="#fbbf24"/>

    <!-- Cute Big Toy Eyes -->
    <!-- Left Eye -->
    <ellipse cx="20" cy="26" rx="2.5" ry="3.2" fill="#0f172a"/>
    <circle cx="19.2" cy="24.8" r="1.1" fill="#ffffff"/>
    <circle cx="21" cy="27.5" r="0.5" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="29" cy="26" rx="2.5" ry="3.2" fill="#0f172a"/>
    <circle cx="28.2" cy="24.8" r="1.1" fill="#ffffff"/>
    <circle cx="30" cy="27.5" r="0.5" fill="#ffffff"/>

    <!-- Cute Rosy Blush Cheeks -->
    <ellipse cx="16" cy="30" rx="2.5" ry="1.4" fill="#f43f5e" opacity="0.45"/>
    <ellipse cx="32.5" cy="30" rx="2.5" ry="1.4" fill="#f43f5e" opacity="0.45"/>

    <!-- Cheerful Little Smile -->
    <path d="M 23 30.5 Q 25 33 27 30.5" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- === YELLOW MAGNIFYING GLASS / SCANNER LOGO === -->
  <g id="yellow-magnifier" filter="url(#softShadow)">
    <!-- Yellow Handle -->
    <line x1="33" y1="35" x2="22" y2="48" stroke="url(#handleYellow)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="22" cy="48" r="3.2" fill="#d97706"/>
    <circle cx="22" cy="48" r="2" fill="#fde047"/>

    <!-- Outer Yellow Rim -->
    <circle cx="41" cy="27" r="17.5" stroke="url(#yellowGlow)" stroke-width="4" fill="#ffffff"/>

    <!-- Inner Lens Glass & Barcode Stripes -->
    <g clip-path="url(#lensBarcodeClip)">
      <rect x="23" y="9" width="36" height="36" fill="#fefce8" opacity="0.85"/>
      <!-- Barcode stripes -->
      <rect x="28" y="14" width="1.8" height="26" fill="#1c1917" rx="0.5"/>
      <rect x="31" y="14" width="1.0" height="26" fill="#1c1917" rx="0.5"/>
      <rect x="33.2" y="14" width="2.4" height="26" fill="#1c1917" rx="0.5"/>
      <rect x="37" y="14" width="1.0" height="26" fill="#1c1917" rx="0.5"/>
      <rect x="39.2" y="14" width="2.2" height="26" fill="#1c1917" rx="0.5"/>
      <rect x="42.6" y="14" width="1.2" height="26" fill="#1c1917" rx="0.5"/>
      <rect x="45" y="14" width="2.0" height="26" fill="#1c1917" rx="0.5"/>
      <rect x="48.2" y="14" width="1.0" height="26" fill="#1c1917" rx="0.5"/>
      <rect x="50.4" y="14" width="1.6" height="26" fill="#1c1917" rx="0.5"/>

      <!-- Glowing Yellow Scan Line -->
      <rect x="25" y="25.5" width="32" height="3" fill="#f59e0b" opacity="0.9" rx="1.5"/>
      <rect x="25" y="26.3" width="32" height="1.4" fill="#fef08a" opacity="0.9" rx="0.7"/>

      <!-- Glass specular highlight arc -->
      <path d="M 30 17 A 13 13 0 0 1 48 18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    </g>

    <!-- Inner gold trim ring -->
    <circle cx="41" cy="27" r="15" stroke="#f59e0b" stroke-width="0.8" fill="none" opacity="0.6"/>
  </g>

  <!-- === CUTE TOY HANDS HOLDING THE LOGO === -->
  <!-- Left hand holding handle securely -->
  <circle cx="28" cy="42" r="3.4" fill="url(#charSkin)"/>
  <path d="M 26 40 C 28 39, 31 42, 29 44" stroke="#fb923c" stroke-width="0.7" fill="none"/>

  <!-- Right hand resting on magnifier rim -->
  <circle cx="34" cy="36" r="3.2" fill="url(#charSkin)"/>
  <circle cx="35" cy="37" r="1.5" fill="#fde68a" opacity="0.6"/>
</svg>
