<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Jeevanreport icon">
  <!-- Outer lens circle -->
  <circle cx="22" cy="21" r="15.5" stroke="#9b7653" stroke-width="2.5" fill="white"/>
  <!-- Barcode lines inside lens (clipped) -->
  <clipPath id="ic-clip">
    <circle cx="22" cy="21" r="13"/>
  </clipPath>
  <g clip-path="url(#ic-clip)">
    <rect x="10" y="9"  width="1.5" height="24" fill="#2c1a0e"/>
    <rect x="12.5" y="9" width="0.8" height="24" fill="#2c1a0e"/>
    <rect x="14.2" y="9" width="2"   height="24" fill="#2c1a0e"/>
    <rect x="17.2" y="9" width="0.8" height="24" fill="#2c1a0e"/>
    <rect x="19"   y="9" width="1.5" height="24" fill="#2c1a0e"/>
    <rect x="21.5" y="9" width="0.8" height="24" fill="#2c1a0e"/>
    <rect x="23.3" y="9" width="2"   height="24" fill="#2c1a0e"/>
    <rect x="26.3" y="9" width="0.8" height="24" fill="#2c1a0e"/>
    <rect x="28.1" y="9" width="1.5" height="24" fill="#2c1a0e"/>
    <rect x="30.6" y="9" width="0.8" height="24" fill="#2c1a0e"/>
    <rect x="32.4" y="9" width="1.5" height="24" fill="#2c1a0e"/>
    <!-- Scan line -->
    <rect x="10" y="18.5" width="25" height="2.5" fill="#9b7653" opacity="0.5" rx="1"/>
  </g>
  <!-- Handle -->
  <line x1="34" y1="33" x2="43" y2="43" stroke="#9b7653" stroke-width="3" stroke-linecap="round"/>
  <circle cx="43" cy="43" r="1.5" fill="#9b7653"/>
</svg>
