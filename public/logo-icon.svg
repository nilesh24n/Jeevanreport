<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" fill="none" role="img" aria-label="JeevanReport Logo - Mascot Hanging from Scanner Handle">
  <defs>
    <!-- Barcode clip for round lens -->
    <clipPath id="lensClip">
      <circle cx="19" cy="17" r="11.5"/>
    </clipPath>
  </defs>

  <!-- === YELLOW SCANNER (Bold, Crisp, High Contrast) === -->
  <g id="scanner">
    <!-- Sturdy Yellow Handle (diagonal down-right) -->
    <line x1="26" y1="24" x2="44" y2="40" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="44" cy="40" r="3.2" fill="#d97706"/>
    <circle cx="44" cy="40" r="1.8" fill="#fde047"/>

    <!-- Lens Outer Ring (Vibrant Golden Yellow) -->
    <circle cx="19" cy="17" r="14" stroke="#f59e0b" stroke-width="4.2" fill="#ffffff"/>

    <!-- Lens Glass & Clean Barcode Stripes -->
    <g clip-path="url(#lensClip)">
      <rect x="5" y="3" width="28" height="28" fill="#ffffff"/>
      
      <!-- 5 Bold, distinct barcode stripes with great spacing -->
      <rect x="10"   y="7" width="2.2" height="20" fill="#18181b" rx="0.6"/>
      <rect x="13.8" y="7" width="1.2" height="20" fill="#18181b" rx="0.4"/>
      <rect x="16.8" y="7" width="3.2" height="20" fill="#18181b" rx="0.6"/>
      <rect x="21.8" y="7" width="1.2" height="20" fill="#18181b" rx="0.4"/>
      <rect x="24.8" y="7" width="2.2" height="20" fill="#18181b" rx="0.6"/>

      <!-- Bold Yellow Laser Beam -->
      <rect x="5" y="15.2" width="28" height="3.2" fill="#f59e0b" rx="1.6"/>
      <rect x="5" y="16.2" width="28" height="1.2" fill="#fef08a" rx="0.6"/>
    </g>

    <!-- Glossy reflection arc on glass -->
    <path d="M 11 11 A 10 10 0 0 1 23 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- === CUTE TOY MASCOT HANGING FROM THE HANDLE === -->
  <g id="mascot-hanging-from-handle">
    <!-- Blue Arms reaching up to the handle -->
    <!-- Left arm to upper hand -->
    <path d="M 31 38 L 31 30" stroke="#2563eb" stroke-width="3.6" stroke-linecap="round"/>
    <!-- Right arm to lower hand -->
    <path d="M 38 41 L 38 35" stroke="#2563eb" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Dangling Body / Hoodie (Vibrant Electric Blue) -->
    <path d="M 30 41 C 29 45, 30 48, 32 49 L 37 49 C 39 48, 40 45, 39 41 Z" fill="#2563eb"/>
    <!-- Yellow zipper detail -->
    <line x1="34.5" y1="41" x2="34.5" y2="45" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Cute swinging legs & shoes -->
    <!-- Left leg dangling straight -->
    <rect x="31" y="48" width="2.6" height="3.5" rx="1" fill="#1d4ed8"/>
    <ellipse cx="32" cy="52" rx="2" ry="1.4" fill="#0f172a"/>

    <!-- Right leg playfully kicking back -->
    <path d="M 36 48 L 39 51" stroke="#1d4ed8" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="40" cy="51.5" rx="2" ry="1.4" fill="#0f172a" transform="rotate(-20 40 51.5)"/>

    <!-- Round Chibi Head -->
    <circle cx="34" cy="37" r="6.5" fill="#fed7aa"/>

    <!-- Sleek Dark Hair / Beanie with Yellow Star Pin -->
    <path d="M 28.5 36 C 28 31.5, 31 30, 34 30 C 37 30, 40 31.5, 39.5 36 C 38 34.5, 36 34.5, 34 35 C 32 34, 30 34.5, 28.5 36 Z" fill="#0f172a"/>
    <circle cx="38" cy="32" r="1.2" fill="#fbbf24"/>

    <!-- Big Expressive Eyes (Bold & Clear) -->
    <circle cx="32" cy="37" r="1.3" fill="#0f172a"/>
    <circle cx="31.6" cy="36.5" r="0.5" fill="#ffffff"/>

    <circle cx="36" cy="37" r="1.3" fill="#0f172a"/>
    <circle cx="35.6" cy="36.5" r="0.5" fill="#ffffff"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="30.2" cy="39" rx="1.2" ry="0.7" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="37.8" cy="39" rx="1.2" ry="0.7" fill="#f43f5e" opacity="0.6"/>

    <!-- Cheerful Smile -->
    <path d="M 33 39.5 Q 34 41 35 39.5" stroke="#9a3412" stroke-width="0.8" stroke-linecap="round" fill="none"/>

    <!-- === ULTRA-VISIBLE CARTOON GLOVES CLAMPED TO HANDLE === -->
    <!-- Distinct white gloves with dark outlines for MAXIMUM contrast against the yellow handle! -->
    
    <!-- Upper Glove (Gripping handle firmly) -->
    <g id="upper-hand">
      <!-- Blue sleeve cuff -->
      <ellipse cx="31" cy="31" rx="2.5" ry="1.2" fill="#1e40af"/>
      <!-- White cartoon glove body -->
      <circle cx="31" cy="29" r="3.2" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
      <!-- Thumb & finger grip lines wrapped over handle -->
      <path d="M 29.5 28.5 Q 31 27.2 32.5 28.5" stroke="#0f172a" stroke-width="1" stroke-linecap="round" fill="none"/>
      <circle cx="28.8" cy="30" r="1.3" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    </g>

    <!-- Lower Glove (Gripping handle firmly) -->
    <g id="lower-hand">
      <!-- Blue sleeve cuff -->
      <ellipse cx="38" cy="36" rx="2.5" ry="1.2" fill="#1e40af"/>
      <!-- White cartoon glove body -->
      <circle cx="38" cy="34" r="3.2" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
      <!-- Thumb & finger grip lines wrapped over handle -->
      <path d="M 36.5 33.5 Q 38 32.2 39.5 33.5" stroke="#0f172a" stroke-width="1" stroke-linecap="round" fill="none"/>
      <circle cx="35.8" cy="35" r="1.3" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    </g>
  </g>
</svg>
